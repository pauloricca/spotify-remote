<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tune · Design preview</title>
<link rel="stylesheet" href="/css/remote.css">
<script src="/js/mockup.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16m5-15 4-1 4 15-4 1Z"/></symbol>
<symbol id="i-music" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M6 9c4-2 8-2 12 0M7 12c3-1.5 7-1.5 10 0m-9 3c3-1 5-1 8 0"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 13 8-13 8Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zm7 0h3v16h-3z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 11 7-11 7Z" fill="currentColor"/><path d="M19 5v14"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="m19 5-11 7 11 7Z" fill="currentColor"/><path d="M5 5v14"/></symbol>
<symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
<symbol id="i-speaker" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><circle cx="12" cy="14" r="3"/><path d="M10 6h4"/></symbol>
<symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13-2c3 2 3 8 0 10m3-13c5 4 5 12 0 16"/></symbol>
<symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h9m4 0 4 3-4 3Z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21 3 12C-3 4 7-2 12 6c5-8 15-2 9 6Z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M5 19 19 5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 4-3 6-6s4-6 6-6h3m-4-4 4 4-4 4"/></symbol>
<symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V8a3 3 0 0 1 3-3h13m-3-3 3 3-3 3M20 13v3a3 3 0 0 1-3 3H4m3 3-3-3 3-3"/></symbol>
</defs></svg>
<main id="explorer" class="remote-shell">
<aside class="sidebar" aria-label="Main navigation">
<a href="#home" class="brand"><svg class="icon"><use href="#i-music"/></svg><span>tune</span></a>
<a href="#home" class="nav-item active" data-nav="home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
<a href="#search" class="nav-item" data-nav="search"><svg class="icon"><use href="#i-search"/></svg><span>Search</span></a>
<a href="#library" class="nav-item" data-nav="library"><svg class="icon"><use href="#i-library"/></svg><span>Your Library</span></a>
<div class="sidebar-caption">Your music. Your space.<span>Design preview</span></div>
</aside>
<header><nav id="navbar">
<div class="search"><form id="demo-search" role="search"><svg class="icon"><use href="#i-search"/></svg><input id="q" type="search" aria-label="Search music" placeholder="Search for artists, songs, albums or playlists..." autocomplete="off"><button type="submit">Search</button></form></div>
<div class="profile"><img src="/images/demo/short-sweet.jpg" alt="Profile"><details class="profile-menu"><summary aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></summary><nav aria-label="Settings"><a href="/auth/login">Connect Spotify</a><a href="#now-playing">Now playing</a><a href="/images/demo/CREDITS.txt" target="_blank" rel="noopener">Artwork credits</a></nav></details></div>
</nav></header>
<section class="media" id="demo-content" aria-label="Music browser" tabindex="-1"></section>
<footer class="mini-player" aria-label="Playback controls">
<a href="#now-playing" aria-label="Open now playing"><img id="mini-cover" src="/images/demo/short-sweet.jpg" alt="Short n’ Sweet album cover"></a>
<div class="meta"><a href="#now-playing" class="name" id="mini-title">Espresso</a><a href="#artist" class="authors" id="mini-artist">Sabrina Carpenter</a></div>
<div class="controls"><div class="button-group">
<button class="button" data-action="prev" aria-label="Previous track"><svg class="icon"><use href="#i-prev"/></svg></button>
<button class="button" data-action="toggle-play" data-test-control="play-pause" aria-label="Pause"><svg class="icon"><use href="#i-pause"/></svg></button>
<button class="button" data-action="next" aria-label="Next track"><svg class="icon"><use href="#i-next"/></svg></button>
</div></div>
<div class="progress"><span id="mini-elapsed">0:00</span><progress id="demo-progress" value="0" max="175" aria-label="Track progress"></progress><span id="mini-duration">2:55</span></div>
<button class="device icon-button" data-action="devices" aria-label="Choose playback device"><svg class="icon"><use href="#i-device"/></svg><span class="visually-hidden">Devices</span></button>
<div class="volume"><div class="button-group"><button class="icon-button" data-action="queue" aria-label="Open queue"><svg class="icon"><use href="#i-queue"/></svg></button><svg class="icon"><use href="#i-volume"/></svg><input type="range" min="0" max="100" value="80" aria-label="Volume" data-volume></div></div>
</footer>
<aside class="drawer" id="demo-drawer" aria-label="Playback panel" hidden></aside>
<div role="status" class="toast" id="demo-toast"></div>
</main>
<p class="demo-caption">Interactive design preview · Playback and devices are simulated. <a href="/auth/login">Connect Spotify to use your music ↗</a></p>
</body></html>
