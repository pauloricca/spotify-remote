name: Tune CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        elixir: ['1.12.3']
        otp: ['24.3.4.17']

    steps:
    - uses: actions/checkout@v4

    - name: Setup elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }} # Define the elixir version [required]
        otp-version: ${{ matrix.otp }}

    - name: Retrieve Mix Dependencies Cache
      uses: actions/cache@v4
      id: mix-cache
      with:
        path: deps
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

    - name: Install Dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - name: Check Formatting
      run: mix format --check-formatted

    - name: Check Credo
      run: mix credo list --format oneline

    - name: Retrieve PLT Cache
      uses: actions/cache@v4
      id: plt-cache
      with:
        path: priv/plts
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plts-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

    - name: Create PLTs
      if: steps.plt-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p priv/plts
        mix dialyzer --plt

    - name: Run dialyzer
      run: mix dialyzer --no-check

  test:
    name: "Elixir Tests"
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        elixir: ['1.12.3']
        otp: ['24.3.4.17']

    steps:
    - uses: actions/checkout@v4

    - name: Setup elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }} # Define the elixir version [required]
        otp-version: ${{ matrix.otp }}

    - name: Retrieve Mix Dependencies Cache
      uses: actions/cache@v4
      id: mix-cache
      with:
        path: deps
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

    - name: Install Dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - name: Run Tests
      run: mix test --timeout 120000
      env:
        CI: "true"
        SPOTIFY_CLIENT_ID: ci-client
        SPOTIFY_CLIENT_SECRET: ci-secret
        ADMIN_USER: ci-admin
        ADMIN_PASSWORD: ci-password
        SECRET_KEY_BASE: ci-only-secret-key-base-for-tests-012345678901234567890123456789012345
        SESSION_ENCRYPTION_SALT: ci-only-session-salt

  js_compile:
    name: "JS Compile and Tests"
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        elixir: ['1.12.3']
        otp: ['24.3.4.17']

    steps:
    - uses: actions/checkout@v4

    - name: Setup elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }} # Define the elixir version [required]
        otp-version: ${{ matrix.otp }}

    - name: Retrieve Mix Dependencies Cache
      uses: actions/cache@v4
      id: mix-cache
      with:
        path: deps
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

    - name: Install Mix Dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get

    - uses: actions/setup-node@v4
      with:
        node-version: '14.21.3'
        cache: npm
        cache-dependency-path: assets/package-lock.json

    - name: Install NPM Dependencies
      run: npm ci --prefix assets

    - name: Compile assets
      run: cd assets && npm run deploy

    - name: Run JS Tests
      run: npm test --prefix assets -- --runInBand
